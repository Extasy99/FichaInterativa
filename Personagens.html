<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Personagens</title>
    <link rel="stylesheet" href="StyleP.css">
</head>
<body>
    <div class="Valorant">
        
        <div class="valorant-card">
            <img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/05e1a996814dd10d7179efee327d29a7be00e912-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=352" alt="Yoru">
            <div class="card-bottom">
                <div class="name">YORU</div>
                <div class="role">DUELISTA</div>
            </div>
        </div> 

        <div class="valorant-card">
            <img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/e435c3378b7999a3338b408dbb5da8ba63f91150-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=288" alt="Breach">
            <div class="card-bottom">
                <div class="name">BREACH</div>
                <div class="role">INICIADOR</div>
            </div>
        </div>

        <div class="valorant-card">
            <img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/ba51d43803082941b0274b66413b0acc972546dd-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=288" alt="Astra">
            <div class="card-bottom">
                <div class="name">ASTRA</div>
                <div class="role">CONTROLADOR</div>
            </div>
        </div>

        <div class="valorant-card">
            <img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/news/d41286dc9017bf79c0b4d907b7a260c27b0adb69-616x822.png?accountingTag=VAL&auto=format&fit=fill&q=80&w=288" alt="Jett">
            <div class="card-bottom">
                <div class="name">JETT</div>
                <div class="role">DUELISTA</div>
            </div>
        </div>

    </div>
    <div id="agent-modal" class="modal-overlay">
        <div class="modal-content">
            <!-- Botão Fechar -->
            <button class="close-btn" id="close-modal">&times;</button>

            <!-- Topo: Informações e Imagem do Agente -->
            <div class="modal-top">
                <div class="agent-info">
                    <h1 id="modal-agent-name"></h1>
                    <p id="modal-agent-bio"></p>
                </div>
                <div class="agent-large-image">
                    <img id="modal-agent-img" src="" alt="Agente Corpo Inteiro">
                </div>
            </div>

            <!-- Linha Divisória Vermelha -->
            <hr class="modal-divider">

            <!-- Base: Habilidades e Vídeo -->
            <div class="modal-bottom">
                
                <!-- LADO ESQUERDO: Ícones -->
                <div class="skills-left">
                    <h3>HABILIDADES ESPECIAIS</h3>
                    <div class="skill-icons">
                        <img class="skill-icon-img" src="" alt="Habilidade 1">
                        <img class="skill-icon-img" src="" alt="Habilidade 2">
                        <img class="skill-icon-img" src="" alt="Habilidade 3">
                        <img class="skill-icon-img" src="" alt="Habilidade 4">
                    </div>
                </div>

                <!-- LADO DIREITO: Vídeo e Textos -->
                <div class="skills-right">
                    <div class="skill-media-container">
                        <video id="skill-video" autoplay loop muted playsinline>
                            <source src="" type="video/mp4">
                        </video>
                    </div>
                    <h4 id="skill-title">NOME DA HABILIDADE</h4>
                    <p id="skill-desc">Descrição da habilidade vai aparecer aqui...</p>
                </div>
                
            </div> <!-- Fim modal-bottom -->

        </div> <!-- Fim modal-content -->
    </div> <!-- Fim modal-overlay -->
    <script src="script.js"></script>
</body>
</html>
